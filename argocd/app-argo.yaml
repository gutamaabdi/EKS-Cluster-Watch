apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-app 
  namespace: argocd 
spec:
  project: default  
  source:
    repoURL: https://github.com/gutamaabdi/EKS-Cluster-Watch.git 
    targetRevision: main 
    path: kube-objects 
  destination:
    server: https://kubernetes.default.svc  
    namespace: my-watch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true