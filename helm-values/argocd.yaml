server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: issuer
    hosts:
      - argocd.gutama-devops-portfolio.link
    tls:
      - secretName: argocd-tls
        hosts:
          - argocd.gutama-devops-portfolio.link
  extraArgs:
    - --insecure